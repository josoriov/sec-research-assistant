version: 2

models:
  - name: stg_source_facts
    description: >
      bronze.source_facts with typed values/periods and a quarantine reason.
      Internal staging view shared by the silver models.
    columns:
      - name: source_fact_id
        description: "bronze.source_facts.id — the bronze reference for this fact."
        tests: [not_null, unique]
      - name: quarantine_reason
        description: "Null when the fact is valid; otherwise why it cannot advance."

  - name: financial_fact_disclosures
    description: >
      Validated disclosure history: one row per valid bronze fact, retaining
      every accession/form/filed_date. Gold selects the latest eligible
      disclosure from here, so restatements that revert and ineligible-form
      comparatives are not lost to deduplication.
    columns:
      - name: source_fact_id
        description: "Bronze reference (bronze.source_facts.id) of this disclosure."
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('bronze', 'source_facts')
                field: id
      - name: cik
        tests: [not_null]
      - name: concept
        tests: [not_null]
      - name: unit
        description: "Reported unit, normalized (trimmed), never converted."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('supported_units') }}"
      - name: period_end
        tests: [not_null]
      - name: value
        description: "Typed numeric value."
        tests: [not_null]
      - name: filed_date
        tests: [not_null]
      - name: accession
        tests: [not_null]

  - name: financial_facts
    description: >
      Silver validated facts deduplicated to the approved grain: one row per
      (cik, concept, unit, period_start, period_end, value), keeping the
      earliest disclosure's bronze reference. Distinct values for the same
      period are retained as restatement history; the full disclosure history
      lives in financial_fact_disclosures.
    columns:
      - name: source_fact_id
        description: "Bronze reference (bronze.source_facts.id) of the retained disclosure."
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('bronze', 'source_facts')
                field: id
      - name: cik
        tests: [not_null]
      - name: concept
        tests: [not_null]
      - name: unit
        description: "Reported unit, normalized (trimmed), never converted."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('supported_units') }}"
      - name: period_end
        tests: [not_null]
      - name: value
        description: "Typed numeric value."
        tests: [not_null]
      - name: filed_date
        tests: [not_null]
      - name: accession
        tests: [not_null]

  - name: financial_facts_quarantine
    description: >
      Facts that failed validation, with the reason and their bronze reference.
      Excluded from gold; retained so failures stay traceable.
    columns:
      - name: source_fact_id
        tests: [not_null, unique]
      - name: reason
        tests: [not_null]

  - name: filings
    description: >
      Validated filing documents (one row per bronze filing manifest). Source
      links and typed filing/report dates; invalid filings quarantine.
    columns:
      - name: manifest_id
        description: "Bronze reference (bronze.manifest.id)."
        tests: [not_null, unique]
      - name: cik
        tests: [not_null]
      - name: accession
        tests: [not_null]
      - name: form
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['10-K', '10-K/A']
      - name: filing_date
        tests: [not_null]
      - name: report_date
        tests: [not_null]

  - name: filings_quarantine
    description: "Filing documents that failed validation, with the reason."
    columns:
      - name: manifest_id
        tests: [not_null, unique]
      - name: reason
        tests: [not_null]

  - name: passages
    description: >
      Validated, heading-aware passages extracted from bronze filing HTML. One
      row per bounded passage; carries its section, hash, processing version, and
      bronze manifest reference.
    columns:
      - name: passage_hash
        description: "Content hash over (text, section, processing version)."
        tests: [not_null]
      - name: block_id
        tests: [not_null, unique]
      - name: cik
        tests: [not_null]
      - name: accession
        tests: [not_null]
      - name: processing_version
        tests: [not_null]
      - name: text
        description: "Nonempty passage text."
        tests: [not_null]
      - name: url
        description: "Source filing URL, carried from the validated filing."
        tests: [not_null]
      - name: manifest_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('filings')
                field: manifest_id

  - name: passages_quarantine
    description: "Passages that failed validation, with the reason."
    columns:
      - name: block_id
        tests: [not_null, unique]
      - name: reason
        tests: [not_null]

