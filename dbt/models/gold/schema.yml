version: 2

models:
  - name: metric_concepts
    description: "Metric -> XBRL tag/unit mapping used to build annual_metrics."
    columns:
      - name: metric
        tests: [not_null]

  - name: annual_metrics
    description: >
      Serving mart: selected annual value per (cik, metric, fiscal period,
      unit), with the selected silver/bronze references and SEC filing
      metadata. Built only from validated silver facts.
    columns:
      - name: cik
        tests: [not_null]
      - name: metric
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['revenue', 'net_income', 'operating_cash_flow']
      - name: unit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD']
      - name: period_start
        tests: [not_null]
      - name: period_end
        tests: [not_null]
      - name: fiscal_year
        tests: [not_null]
      - name: value
        tests: [not_null]
      - name: source_fact_id
        description: "Selected silver disclosure id (gold -> silver lineage)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('financial_fact_disclosures')
                field: source_fact_id
      - name: manifest_id
        description: "Bronze object reference (gold -> silver -> bronze lineage)."
        tests: [not_null]
      - name: accession
        tests: [not_null]
      - name: filed_date
        tests: [not_null]

  - name: retrieval_passages
    description: >
      Serving retrieval dataset: eligible silver passages joined to their
      embeddings, with citation metadata and a supersession flag. Built only
      from validated silver and the model-matching embeddings; default
      retrieval filters is_superseded = false.
    columns:
      - name: passage_id
        description: "Selected silver passage id (gold -> silver lineage)."
        tests: [not_null, unique]
      - name: cik
        tests: [not_null]
      - name: accession
        tests: [not_null]
      - name: manifest_id
        description: "Bronze object reference (gold -> silver -> bronze lineage)."
        tests: [not_null]
      - name: passage_hash
        tests: [not_null]
      - name: processing_version
        tests: [not_null]
      - name: text
        tests: [not_null]
      - name: url
        description: "Source filing URL for citations."
        tests: [not_null]
      - name: model_version
        tests: [not_null]
      - name: embedding
        description: "pgvector embedding of the passage."
        tests: [not_null]
      - name: is_superseded
        tests: [not_null]
