name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-cpu.txt
            requirements.lock
      - name: Install locked CPU dependencies
        run: |
          python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu -r requirements-cpu.txt
          python -m pip install -r requirements.lock
          python -m pip check
      - run: python -m pytest tests -q
      - name: Validate Compose
        run: docker compose --env-file .env.example config -q

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit both locked environments
        run: |
          pip-audit --disable-pip --no-deps -r requirements.lock
          pip-audit --disable-pip --no-deps -r airflow/requirements.lock
          sed 's/+cpu//' requirements-cpu.txt > /tmp/torch-audit.txt
          pip-audit --disable-pip --no-deps -r /tmp/torch-audit.txt

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo
          --redact=100 --log-opts="--all" --no-banner
