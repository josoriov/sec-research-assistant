# Local development stack for the SEC Research Assistant (task T001).
#
# Compose specification, so `docker compose` and `podman-compose` both work.
# Every credential comes from the environment (.env); see .env.example.
#
# Images are fully qualified so they resolve identically under Docker and
# Podman. The MinIO defaults point at Chainguard's maintained builds because
# MinIO removed its own public images from Docker Hub and Quay in 2025-2026;
# override MINIO_IMAGE / MINIO_CLIENT_IMAGE in .env if you prefer another source.
name: sec-research-assistant

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Read by db/init/01-init.sh to create the pipeline and API roles.
      PIPELINE_DB_USER: ${PIPELINE_DB_USER:?set PIPELINE_DB_USER in .env}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD:?set PIPELINE_DB_PASSWORD in .env}
      GOLD_API_DB_USER: ${GOLD_API_DB_USER:?set GOLD_API_DB_USER in .env}
      GOLD_API_DB_PASSWORD: ${GOLD_API_DB_PASSWORD:?set GOLD_API_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # One-shot: creates the bronze/ bucket once MinIO accepts requests.
  # Restarts on failure to absorb the server's startup delay (the client image
  # is shell-less, so a retry loop is not available).
  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    restart: on-failure
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}:${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-bronze}"]

  # Python application. Dependencies are installed from the repo mount at start
  # because there is no Dockerfile yet (decision H003); the container then stays
  # up so ingestion can be run with
  #   docker compose exec app python -m ingestion --company AAPL --years 3
  app:
    image: docker.io/library/python:3.12-slim
    working_dir: /app
    command: ["sh", "-c", "pip install --no-cache-dir -q -r requirements.txt && exec sleep infinity"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PIPELINE_DB_USER: ${PIPELINE_DB_USER}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      GOLD_API_DB_USER: ${GOLD_API_DB_USER}
      GOLD_API_DB_PASSWORD: ${GOLD_API_DB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-bronze}
      SEC_USER_AGENT: ${SEC_USER_AGENT:?set SEC_USER_AGENT in .env}
    volumes:
      - .:/app

  # One-shot: create the Airflow metadata database if it is missing. Idempotent,
  # so it also covers data volumes initialized before T007 (init hooks do not
  # rerun). Airflow metadata is kept separate from the application data.
  airflow-db-init:
    image: docker.io/library/postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='airflow'" | grep -q 1 \
          || psql -h postgres -d postgres -c 'CREATE DATABASE airflow'

  # Airflow 3 (LocalExecutor) runs the T007 pipeline using the same CLIs and
  # .env as the app service. The repo is mounted and the image already contains
  # the pipeline dependencies plus dbt-postgres (decision H009).
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      airflow-db-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # The metadata URL is built at startup with URL-encoded credentials (F037):
      # compose cannot safely paste a password containing '@' into a URL.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read-only API role: the candidate post-hook revokes and the publisher
      # grants SELECT on the served gold tables (F036).
      GOLD_API_DB_USER: ${GOLD_API_DB_USER}
      # dbt and Python pipeline steps reuse the stack's connection variables.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: "5432"
      PIPELINE_DB_USER: ${PIPELINE_DB_USER}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-bronze}
      SEC_USER_AGENT: ${SEC_USER_AGENT:?set SEC_USER_AGENT in .env}
      PYTHONPATH: /opt/airflow/repo
      # The wrapper at /opt/airflow/bin/airflow builds the encoded metadata URL
      # for the container command and for `compose exec` (F037).
      PATH: /opt/airflow/bin:/home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin
      # The repo is mounted read-only; keep dbt and Python artifacts writable.
      PYTHONDONTWRITEBYTECODE: "1"
      DBT_TARGET_PATH: /tmp/dbt-target
      DBT_LOG_PATH: /tmp/dbt-logs
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
    volumes:
      - .:/opt/airflow/repo:ro
      - airflow-logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - airflow db migrate && exec airflow standalone

volumes:
  pgdata:
  minio-data:
  airflow-logs:
