# Local development stack for the SEC Research Assistant.
#
# Compose specification, so `docker compose` and `podman-compose` both work.
# Every credential comes from the environment (.env); see .env.example.
#
# Images are fully qualified so they resolve identically under Docker and
# Podman. Override MINIO_IMAGE / MINIO_CLIENT_IMAGE in .env to pin a digest.
name: sec-research-assistant

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Read by db/init/01-init.sh to create the pipeline and API roles.
      PIPELINE_DB_USER: ${PIPELINE_DB_USER:?set PIPELINE_DB_USER in .env}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD:?set PIPELINE_DB_PASSWORD in .env}
      GOLD_API_DB_USER: ${GOLD_API_DB_USER:?set GOLD_API_DB_USER in .env}
      GOLD_API_DB_PASSWORD: ${GOLD_API_DB_PASSWORD:?set GOLD_API_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # One-shot: creates the bronze/ bucket once MinIO accepts requests.
  # Restarts on failure to absorb the server's startup delay (the client image
  # is shell-less, so a retry loop is not available).
  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    restart: on-failure
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}:${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-bronze}"]

  # API only: pipeline commands run in the Airflow service.
  app:
    image: localhost/sec-research-assistant_api:cpu
    build:
      context: .
      dockerfile: api/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_HOST: 0.0.0.0
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      LLM_INPUT_COST_PER_1K: ${LLM_INPUT_COST_PER_1K:-}
      LLM_OUTPUT_COST_PER_1K: ${LLM_OUTPUT_COST_PER_1K:-}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      GOLD_API_DB_USER: ${GOLD_API_DB_USER}
      GOLD_API_DB_PASSWORD: ${GOLD_API_DB_PASSWORD}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  # Natural-language question UI (Astro SSR, task T012). It forwards the browser's
  # same-origin /api/ask request to the API over the Compose network, so the API
  # host stays private and no CORS is needed.
  web:
    image: localhost/sec-research-assistant_web:cpu
    build:
      context: ./web
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      API_BASE_URL: http://app:8000
      HOST: 0.0.0.0
      PORT: "4321"
    ports:
      - "127.0.0.1:${WEB_PORT:-4321}:4321"

  # One-shot: create the Airflow metadata database on fresh or existing volumes.
  airflow-db-init:
    image: docker.io/library/postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='airflow'" | grep -q 1 \
          || psql -h postgres -d postgres -c 'CREATE DATABASE airflow'

  # Airflow runs the pipeline CLIs with write credentials and a read-only checkout.
  airflow:
    image: localhost/sec-research-assistant_airflow:cpu
    build:
      context: .
      dockerfile: airflow/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      airflow-db-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # The metadata URL is built at startup with URL-encoded credentials:
      # compose cannot safely paste a password containing '@' into a URL.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read-only API role: the candidate post-hook revokes and the publisher
      # grants SELECT on the served gold tables.
      GOLD_API_DB_USER: ${GOLD_API_DB_USER}
      # dbt and Python pipeline steps reuse the stack's connection variables.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: "5432"
      PIPELINE_DB_USER: ${PIPELINE_DB_USER}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-bronze}
      SEC_USER_AGENT: ${SEC_USER_AGENT:?set SEC_USER_AGENT in .env}
      PYTHONPATH: /opt/airflow/repo
      # The wrapper at /opt/airflow/bin/airflow builds the encoded metadata URL
      # for the container command and for `compose exec`.
      PATH: /opt/airflow/bin:/home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin
      # The repo is mounted read-only; keep dbt and Python artifacts writable.
      PYTHONDONTWRITEBYTECODE: "1"
      DBT_TARGET_PATH: /tmp/dbt-target
      DBT_LOG_PATH: /tmp/dbt-logs
    working_dir: /opt/airflow/repo
    volumes:
      - .:/opt/airflow/repo:ro
      - airflow-logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - airflow db migrate && exec airflow standalone

volumes:
  pgdata:
  minio-data:
  airflow-logs:
